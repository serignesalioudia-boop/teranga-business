services:
  db:
    image: postgres:17-alpine
    container_name: teranga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teranga_business}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teranga_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teranga_business}
    ports:
      - "5432:5432"
    volumes:
      - teranga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teranga} -d ${POSTGRES_DB:-teranga_business}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: teranga-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    volumes:
      - ./docker/adminer-plugins-enabled:/var/www/html/plugins-enabled:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  teranga_pgdata:
